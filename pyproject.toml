[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atof"
version = "0.2.0"
description = "Topology-aware graph optimization and adaptive strategy selection."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chris Hotza"}]
dependencies = [
  "networkx>=3.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
