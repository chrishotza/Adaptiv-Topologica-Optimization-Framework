[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atof"
version = "0.6.0"
description = "AI-first open-source graph partitioning and optimization interface for Python, NetworkX, METIS, KaHIP, and AI agents."
keywords = [
  "graph partitioning",
  "graph optimization",
  "balanced graph partitioning",
  "k-way partitioning",
  "networkx",
  "metis",
  "kahip",
  "kernighan-lin",
  "bloc-reloc",
  "graph algorithms",
  "ai agents",
  "llm tools",
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Chris Hotza"}]
dependencies = [
  "networkx>=3.0",
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/chrishotza/Adaptiv-Topologica-Optimization-Framework"
Repository = "https://github.com/chrishotza/Adaptiv-Topologica-Optimization-Framework"
Documentation = "https://github.com/chrishotza/Adaptiv-Topologica-Optimization-Framework#readme"
Issues = "https://github.com/chrishotza/Adaptiv-Topologica-Optimization-Framework/issues"

[project.scripts]
atof = "atof.cli:main"

[project.optional-dependencies]
analysis = [
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]
metis = [
  "pymetis>=2025.2.2,<2026",
]
kahip = [
  "kahip>=3.25,<4",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
