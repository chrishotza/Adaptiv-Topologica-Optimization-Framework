name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Import smoke test
        run: python -c "import atof; print('ATOF', atof.__version__)"

      - name: Unit tests
        run: pytest

      - name: Product CLI smoke tests
        run: |
          python -m atof ai >/tmp/atof-ai.json
          python -m atof doctor >/tmp/atof-doctor.json
          python -m atof solve examples/demo.edgelist >/tmp/atof-solve.json
          python -m atof solve examples/demo.json >/tmp/atof-json.json
          printf '{"nodes":["a","b"],"edges":[["a","b"]]}' | python -m atof solve - --format json >/tmp/atof-stdin-json.json
          printf 'a b\nb c\nc d\n' | python -m atof solve - >/tmp/atof-stdin.json
          python - <<'PY'
          import json
          for name in ("atof-ai.json", "atof-doctor.json", "atof-solve.json", "atof-json.json", "atof-stdin-json.json"):
              with open(f"/tmp/{name}", encoding="utf-8") as handle:
                  payload = json.load(handle)
              assert isinstance(payload, dict), name
          PY

      - name: Canonical benchmark smoke test
        run: |
          python -m experiments.run_canonical
          python -m experiments.summarize_results

      - name: Dynamics observatory smoke test
        run: python -m experiments.run_observatory

      - name: Routing benchmark smoke test
        run: python -m experiments.run_routing_evaluation

      - name: Statistical benchmark smoke test
        run: python -m experiments.run_statistical_analysis

      - name: External validation smoke test
        run: python -m experiments.run_external_validation

      - name: Validate benchmark output
        run: |
          test -s results/canonical/latest.json
          test -s results/canonical/summary.csv
          test -s results/observatory/latest.json
          test -s results/routing/latest.json
          test -s results/statistics/latest.json
          test -s results/external/latest.json

  package:
    name: Validate Python distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

  snap-kway-scalability:
    name: SNAP k-way scalability (hardening branch)
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/topology-profile-scalability-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev,sota]"

      - name: Run k-way stress
        run: python -m experiments.run_snap_kway_scalability

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("results/snap/kway-scalability-latest.json").read_text(encoding="utf-8"))
          assert payload["parameters"]["ks"] == [2, 4, 8]
          assert payload["parameters"]["profile_mode"] == "bounded"
          assert len(payload["rows"]) == 9
          PY

      - name: Upload stress manifest
        uses: actions/upload-artifact@v4
        with:
          name: atof-snap-kway-scalability
          path: results/snap/kway-scalability-latest.json
