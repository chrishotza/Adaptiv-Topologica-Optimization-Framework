name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Import smoke test
        run: python -c "import atof; print('ATOF', atof.__version__)"

      - name: Unit tests
        run: pytest

      - name: Product CLI smoke tests
        run: |
          python -m atof ai >/tmp/atof-ai.json
          python -m atof doctor >/tmp/atof-doctor.json
          python -m atof doctor --probe >/tmp/atof-doctor-probe.json
          python -m atof solve examples/demo.edgelist >/tmp/atof-solve.json
          python -m atof solve examples/demo.json >/tmp/atof-json.json
          printf '{"nodes":["a","b"],"edges":[["a","b"]]}' | python -m atof solve - --format json >/tmp/atof-stdin-json.json
          printf 'a b\nb c\nc d\n' | python -m atof solve - >/tmp/atof-stdin.json
          python - <<'PY'
          import json
          for name in ("atof-ai.json", "atof-doctor.json", "atof-doctor-probe.json", "atof-solve.json", "atof-json.json", "atof-stdin-json.json"):
              with open(f"/tmp/{name}", encoding="utf-8") as handle:
                  payload = json.load(handle)
              assert isinstance(payload, dict), name
          probe = json.loads(open("/tmp/atof-doctor-probe.json", encoding="utf-8").read())
          assert probe["schema"] == "atof.doctor.v1"
          assert probe["probe"]["requested"] is True
          assert probe["probe"]["k2"]["k"] == 2
          assert probe["probe"]["k4"]["k"] == 4
          PY

      - name: Canonical benchmark smoke test
        run: |
          python -m experiments.run_canonical
          python -m experiments.summarize_results

      - name: Dynamics observatory smoke test
        run: python -m experiments.run_observatory

      - name: Routing benchmark smoke test
        run: python -m experiments.run_routing_evaluation

      - name: Statistical benchmark smoke test
        run: python -m experiments.run_statistical_analysis

      - name: External validation smoke test
        run: python -m experiments.run_external_validation

      - name: Validate benchmark output
        run: |
          test -s results/canonical/latest.json
          test -s results/canonical/summary.csv
          test -s results/observatory/latest.json
          test -s results/routing/latest.json
          test -s results/statistics/latest.json
          test -s results/external/latest.json

  k8-external-solver-matrix:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'research/k8-external-solver-ci-exec' }}
    name: Frozen k8 external solver matrix (${{ matrix.dataset }}/${{ matrix.strategy }}/seed=${{ matrix.seed }})
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dataset: [ca_astroph, ca_condmat]
        seed: [5003, 7003, 9001, 12011, 16001]
        strategy: [bloc, bloc-affinity, metis, kahip, kaminpar, kaminpar-strong, mtkahypar, mtkahypar-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark backends
        run: python -m pip install -e ".[dev,sota,metis,kahip]"
      - name: Run solver unit
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts/unit .cache/snap_external
          python experiments/k8_external_solver_unit.py \
            --dataset "${{ matrix.dataset }}" \
            --strategy "${{ matrix.strategy }}" \
            --seed "${{ matrix.seed }}" \
            --output "artifacts/unit/${{ matrix.dataset }}__${{ matrix.strategy }}__${{ matrix.seed }}.json" \
            --cache-dir .cache/snap_external
      - name: Upload solver unit
        uses: actions/upload-artifact@v4
        with:
          name: k8-external-unit-${{ matrix.dataset }}-${{ matrix.strategy }}-${{ matrix.seed }}
          path: artifacts/unit/*.json

  k8-external-solver-aggregate:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'research/k8-external-solver-ci-exec' }}
    needs: k8-external-solver-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF
        run: python -m pip install -e ".[dev]"
      - name: Download frozen training fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/training
          curl -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o artifacts/training/prior.zip \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10912529806/zip"
          unzip -q artifacts/training/prior.zip -d artifacts/training
          test -f artifacts/training/k8_external_training_fixture.json
      - name: Download solver units
        uses: actions/download-artifact@v4
        with:
          pattern: k8-external-unit-*
          path: artifacts/units
          merge-multiple: true
      - name: Aggregate external holdout
        env:
          PYTHONPATH: .
        run: |
          python experiments/k8_external_solver_aggregate.py \
            --input-dir artifacts/units \
            --training-fixture artifacts/training/k8_external_training_fixture.json \
            --output artifacts/k8_external_solver_matrix_latest.json \
            --cache-dir .cache/snap_external
      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: k8-external-solver-matrix
          path: artifacts/k8_external_solver_matrix_latest.json

  package:
    name: Validate Python distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*
