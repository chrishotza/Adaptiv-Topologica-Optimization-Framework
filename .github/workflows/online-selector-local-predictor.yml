name: Online selector local predictor research

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/online_selector_local_predictor.py"
      - "tests/test_online_selector_local_predictor.py"
      - ".github/workflows/online-selector-local-predictor.yml"
      - "experiments/online_topk_selector.py"
      - "experiments/selector_threshold_sensitivity.py"
      - "experiments/fresh_sota_protocol.py"
      - "src/atof/routing.py"
      - "src/atof/statistics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-predictor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF and benchmark backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,metis,kahip,sota,dev]"
      - name: Run local predictor tests
        run: pytest -q tests/test_online_selector_local_predictor.py
      - name: Run fresh benchmark
        run: |
          python -m experiments.fresh_sota_protocol             --output results/state_of_art/fresh_sota_latest.json             --cache-dir .cache/snap
      - name: Validate benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/fresh_sota_latest.json").read_text(encoding="utf-8"))
          assert payload["matched_graphs"] == 20
          assert len(payload["candidate_strategies"]) == 11
          assert payload["seeds"] == [42, 101, 2024]
          assert len(payload["rows"]) == 660
          assert all(row["status"] == "ok" for row in payload["rows"])
          PY
      - name: Run local predictor analysis
        run: |
          python -m experiments.online_selector_local_predictor             --benchmark results/state_of_art/fresh_sota_latest.json             --output results/state_of_art/online_selector_local_predictor_latest.json
      - name: Validate local predictor manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/online_selector_local_predictor_latest.json").read_text(encoding="utf-8"))
          assert payload["local_k_values"] == [3, 5, 7]
          assert payload["thresholds"] == [0.0, 0.005, 0.008, 0.009]
          assert len(payload["cells"]) == 13
          assert all(cell["graphs"] == 20 for cell in payload["cells"])
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-selector-local-predictor
          path: |
            results/state_of_art/fresh_sota_latest.json
            results/state_of_art/online_selector_local_predictor_latest.json
          if-no-files-found: error
