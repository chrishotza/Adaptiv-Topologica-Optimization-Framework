name: Confidence-gated allocation research gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - "experiments/confidence_gated_allocation.py"
      - "tests/test_confidence_gated_allocation.py"
      - ".github/workflows/confidence-gated-allocation.yml"
      - "experiments/fresh_sota_protocol.py"
      - "src/atof/routing.py"
      - "src/atof/statistics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ATOF and benchmark backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,metis,kahip,sota,dev]"

      - name: Run allocation unit tests
        run: |
          pytest -q tests/test_confidence_gated_allocation.py

      - name: Run fresh benchmark
        run: |
          python -m experiments.fresh_sota_protocol             --output results/state_of_art/fresh_sota_latest.json             --cache-dir .cache/snap

      - name: Validate fresh benchmark completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/state_of_art/fresh_sota_latest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["matched_graphs"] == 20
          assert len(payload["candidate_strategies"]) == 11
          assert payload["seeds"] == [42, 101, 2024]
          assert len(payload["rows"]) == 660
          assert all(row["status"] == "ok" for row in payload["rows"])
          PY

      - name: Run confidence-gated allocation replay
        run: |
          python -m experiments.confidence_gated_allocation             --benchmark results/state_of_art/fresh_sota_latest.json             --output results/state_of_art/confidence_gated_allocation_latest.json

      - name: Validate allocation manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/state_of_art/confidence_gated_allocation_latest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["matched_graphs"] == 20
          assert payload["frozen_policy"]["budget_factor"] == 2.0
          assert payload["frozen_policy"]["confidence_quantile"] == 0.5
          assert payload["frozen_policy"]["min_improvement_after_probe"] == 0.0
          assert payload["frozen_policy"]["threshold_is_training_only"] is True
          assert len(payload["folds"]) == len(payload["corpora"])
          PY

      - name: Upload allocation artifact
        uses: actions/upload-artifact@v4
        with:
          name: confidence-gated-allocation
          path: |
            results/state_of_art/fresh_sota_latest.json
            results/state_of_art/confidence_gated_allocation_latest.json
          if-no-files-found: error
