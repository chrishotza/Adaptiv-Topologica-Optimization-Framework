name: Top-k routing coverage research

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/topk_routing_coverage.py"
      - "tests/test_topk_routing_coverage.py"
      - ".github/workflows/topk-routing-coverage.yml"
      - "experiments/fresh_sota_protocol.py"
      - "src/atof/routing.py"
      - "src/atof/statistics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF and benchmark backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,metis,kahip,sota,dev]"
      - name: Run top-k tests
        run: pytest -q tests/test_topk_routing_coverage.py
      - name: Run fresh benchmark
        run: |
          python -m experiments.fresh_sota_protocol             --output results/state_of_art/fresh_sota_latest.json             --cache-dir .cache/snap
      - name: Validate fresh benchmark completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/fresh_sota_latest.json").read_text(encoding="utf-8"))
          assert payload["matched_graphs"] == 20
          assert len(payload["candidate_strategies"]) == 11
          assert payload["seeds"] == [42, 101, 2024]
          assert len(payload["rows"]) == 660
          assert all(row["status"] == "ok" for row in payload["rows"])
          PY
      - name: Run top-k coverage
        run: |
          python -m experiments.topk_routing_coverage             --benchmark results/state_of_art/fresh_sota_latest.json             --output results/state_of_art/topk_routing_coverage_latest.json
      - name: Validate top-k manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/topk_routing_coverage_latest.json").read_text(encoding="utf-8"))
          assert payload["aggregate"]["graphs"] == 20
          assert set(payload["aggregate"]["coverage"]) == {"1", "2", "3"}
          assert len(payload["folds"]) == 4
          PY
      - name: Upload top-k artifact
        uses: actions/upload-artifact@v4
        with:
          name: topk-routing-coverage
          path: |
            results/state_of_art/fresh_sota_latest.json
            results/state_of_art/topk_routing_coverage_latest.json
          if-no-files-found: error
