name: State-of-art benchmark

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "experiments/run_state_of_art_benchmark.py"
      - "experiments/mtkahypar_backend.py"
      - "pyproject.toml"
      - "tests/test_state_of_art_benchmark.py"
      - "tests/test_mtkahypar_backend.py"
      - "docs/state-of-art-benchmark.md"
      - "docs/state-of-art-2026-map.md"
      - ".github/workflows/state-of-art-benchmark.yml"
      - "src/atof/strategies.py"
      - "experiments/**"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,metis,kahip,kaminpar,mtkahypar,dev]"

      - name: Run 20-graph benchmark
        run: |
          python -m experiments.run_state_of_art_benchmark \
            --output results/state_of_art/latest.json \
            --cache-dir .cache/snap

      - name: Analyze fresh solver-router transfer
        run: |
          python -m experiments.run_solver_router_transfer \
            --benchmark results/state_of_art/latest.json \
            --output results/state_of_art/solver_router_transfer.json

      - name: Validate solver-router transfer manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/state_of_art/solver_router_transfer.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["unit_of_analysis"] == "graph"
          assert payload["matched_graphs"] >= 2
          assert payload["controls"] == ["majority", "global_mean"]
          assert payload["oracle_unique_strategy_count"] >= 1
          assert set(payload["oracle_distribution"]) == set(payload["corpora"])
          assert set(payload["macro"]) == {
              "nearest_vs_majority",
              "nearest_vs_global_mean",
              "centroid_vs_majority",
              "centroid_vs_global_mean",
          }
          for summary in payload["pooled"].values():
              assert "mean_router_runtime_ratio" in summary
              assert "mean_control_runtime_ratio" in summary
              assert "joint_quality_runtime_dominance_rate" in summary
          PY

      - name: Upload solver-router transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: solver-router-transfer
          path: results/state_of_art/solver_router_transfer.json
          if-no-files-found: error

      - name: Upload benchmark manifest
        uses: actions/upload-artifact@v4
        with:
          name: state-of-art-benchmark
          path: results/state_of_art/latest.json
          if-no-files-found: error

      - name: Upload SNAP cache
        uses: actions/upload-artifact@v4
        with:
          name: state-of-art-snap-cache
          path: .cache/snap
          if-no-files-found: ignore