name: Confidence-gate sensitivity research

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/confidence_gate_sensitivity.py"
      - "tests/test_confidence_gate_sensitivity.py"
      - ".github/workflows/confidence-gate-sensitivity.yml"
      - "experiments/confidence_gated_allocation.py"
      - "experiments/fresh_sota_protocol.py"
      - "src/atof/routing.py"
      - "src/atof/statistics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF and benchmark backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,metis,kahip,sota,dev]"
      - name: Run sensitivity tests
        run: pytest -q tests/test_confidence_gate_sensitivity.py
      - name: Run fresh benchmark
        run: |
          python -m experiments.fresh_sota_protocol             --output results/state_of_art/fresh_sota_latest.json             --cache-dir .cache/snap
      - name: Validate fresh benchmark completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/fresh_sota_latest.json").read_text(encoding="utf-8"))
          assert payload["matched_graphs"] == 20
          assert len(payload["candidate_strategies"]) == 11
          assert payload["seeds"] == [42, 101, 2024]
          assert len(payload["rows"]) == 660
          assert all(row["status"] == "ok" for row in payload["rows"])
          PY
      - name: Run sensitivity matrix
        run: |
          python -m experiments.confidence_gate_sensitivity             --benchmark results/state_of_art/fresh_sota_latest.json             --output results/state_of_art/confidence_gate_sensitivity_latest.json
      - name: Validate sensitivity manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/confidence_gate_sensitivity_latest.json").read_text(encoding="utf-8"))
          assert payload["matched_graphs"] == 20
          assert payload["quantiles"] == [0.25, 0.5, 0.75]
          assert payload["budget_factors"] == [1.0, 1.5, 2.0, 3.0]
          assert len(payload["matrix"]) == 12
          assert payload["frozen_reference"] == {"budget_factor": 2.0, "quantile": 0.5}
          PY
      - name: Upload sensitivity artifact
        uses: actions/upload-artifact@v4
        with:
          name: confidence-gate-sensitivity
          path: |
            results/state_of_art/fresh_sota_latest.json
            results/state_of_art/confidence_gate_sensitivity_latest.json
          if-no-files-found: error
