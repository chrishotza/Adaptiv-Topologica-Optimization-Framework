name: Soft balance k4 benchmark

on:
  pull_request:
    paths:
      - "src/atof/soft_balance.py"
      - "experiments/generate_suite.py"
      - "experiments/run_soft_balance_k4.py"
      - "tests/test_soft_balance.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k4:
    name: Soft balance k4 benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run k4 benchmark
        run: python -m experiments.run_soft_balance_k4
      - name: Validate k4 benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(
              Path("results/soft-balance-k4/latest.json").read_text(encoding="utf-8")
          )
          assert payload["k"] == 4
          assert len(payload["rows"]) == 168
          assert all(row["soft_balance_error"] == 0.0 for row in payload["rows"])
          PY
      - name: Upload k4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: soft-balance-k4
          path: results/soft-balance-k4/latest.json
