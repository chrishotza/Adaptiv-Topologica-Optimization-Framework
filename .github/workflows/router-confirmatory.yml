name: Router confirmatory candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/run_router_confirmatory.py"
      - "tests/test_router_confirmatory.py"
      - ".github/workflows/router-confirmatory.yml"

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/test_router_confirmatory.py
      - name: Run locked confirmatory comparison
        run: python -m experiments.run_router_confirmatory
      - name: Validate result
        run: |
          test -s results/generalization/router_confirmatory.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("results/generalization/router_confirmatory.json").read_text())
          expected = {
              "all_iqr_l2",
              "global_paths_iqr_l2",
              "global_paths_minmax_l2",
          }
          assert set(payload["locked_configs"]) == expected
          assert set(payload["configs"]) == expected
          for study in payload["configs"].values():
              assert study["macro"]["majority_mean_relative_regret"] >= 0
          print("validated locked configurations:", sorted(expected))
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atof-router-confirmatory
          path: results/generalization/router_confirmatory.json
