name: Independent DIMACS transfer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/atof/dimacs.py"
      - "experiments/run_independent_dimacs_transfer.py"
      - "tests/test_dimacs.py"
      - ".github/workflows/independent-dimacs-transfer.yml"
      - "experiments/run_router_kahip_confirmatory.py"
      - "experiments/run_router_scaling_ablation.py"
      - "experiments/run_router_confirmatory.py"
      - "src/atof/strategies.py"
      - "src/atof/routing.py"
      - "src/atof/generalization.py"
      - "pyproject.toml"
  push:
    branches:
      - "main"
      - "research/independent-dimacs-transfer"
    paths:
      - "src/atof/dimacs.py"
      - "experiments/run_independent_dimacs_transfer.py"
      - "tests/test_dimacs.py"
      - ".github/workflows/independent-dimacs-transfer.yml"
      - "experiments/run_router_kahip_confirmatory.py"
      - "experiments/run_router_scaling_ablation.py"
      - "experiments/run_router_confirmatory.py"
      - "src/atof/strategies.py"
      - "src/atof/routing.py"
      - "src/atof/generalization.py"
      - "pyproject.toml"

jobs:
  independent-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,kahip,metis,analysis]"
      - name: Unit tests
        run: pytest tests/test_dimacs.py
      - name: Run independent transfer
        run: python -m experiments.run_independent_dimacs_transfer
      - name: Validate result
        run: |
          test -s results/generalization/independent_dimacs_transfer.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/generalization/independent_dimacs_transfer.json").read_text()
          )
          assert payload["candidate_strategy_count"] == 9
          assert payload["total_graphs"] == 26
          assert set(payload["corpora"]) == {
              "development",
              "external",
              "snap",
              "snap_scalability",
              "dimacs",
          }
          assert sum(item["graphs"] for item in payload["corpora"].values()) == 26
          assert "metis_multilevel_balanced" in payload["candidate_strategies"]
          assert "kahip_kaffpa_strong_balanced" in payload["candidate_strategies"]
          assert set(payload["configs"]) == {
              "all_iqr_l2",
              "global_paths_iqr_l2",
              "global_paths_minmax_l2",
          }
          assert payload["corpora"]["dimacs"]["graphs"] == 6
          print("validated independent DIMACS transfer:", payload["total_graphs"], "graphs")
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atof-independent-dimacs-transfer
          path: results/generalization/independent_dimacs_transfer.json
