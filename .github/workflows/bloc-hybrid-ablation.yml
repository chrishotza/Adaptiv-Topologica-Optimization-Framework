name: BLOC-RELOC hybrid ablation

on:
  pull_request:
    paths:
      - "src/atof/strategies.py"
      - "experiments/generate_suite.py"
      - "experiments/run_bloc_hybrid_ablation.py"
      - "tests/test_hybrid_ablation.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ablation:
    name: Run hybrid ablation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run hybrid ablation
        run: python -m experiments.run_bloc_hybrid_ablation

      - name: Validate ablation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/hybrid-ablation/latest.json").read_text(encoding="utf-8")
          )
          assert payload["summary"]["comparisons"] == 42
          assert len(payload["rows"]) == 42
          PY

      - name: Upload ablation artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloc-hybrid-ablation
          path: results/hybrid-ablation/latest.json
