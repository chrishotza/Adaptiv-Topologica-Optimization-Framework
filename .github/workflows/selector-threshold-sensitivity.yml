name: Online selector threshold sensitivity research

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/selector_threshold_sensitivity.py"
      - "tests/test_selector_threshold_sensitivity.py"
      - ".github/workflows/selector-threshold-sensitivity.yml"
      - "experiments/online_topk_selector.py"
      - "experiments/fresh_sota_protocol.py"
      - "src/atof/routing.py"
      - "src/atof/statistics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF and benchmark backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,metis,kahip,sota,dev]"
      - name: Run sensitivity tests
        run: pytest -q tests/test_selector_threshold_sensitivity.py
      - name: Run fresh benchmark
        run: |
          python -m experiments.fresh_sota_protocol             --output results/state_of_art/fresh_sota_latest.json             --cache-dir .cache/snap
      - name: Validate benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/fresh_sota_latest.json").read_text(encoding="utf-8"))
          assert payload["matched_graphs"] == 20
          assert payload["candidate_strategies"] and len(payload["candidate_strategies"]) == 11
          assert payload["seeds"] == [42, 101, 2024]
          assert len(payload["rows"]) == 660
          assert all(row["status"] == "ok" for row in payload["rows"])
          PY
      - name: Run threshold sensitivity
        run: |
          python -m experiments.selector_threshold_sensitivity             --benchmark results/state_of_art/fresh_sota_latest.json             --output results/state_of_art/selector_threshold_sensitivity_latest.json
      - name: Validate sensitivity manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/selector_threshold_sensitivity_latest.json").read_text(encoding="utf-8"))
          assert payload["thresholds"] == [0.0, 0.0025, 0.005, 0.01, 0.02]
          assert len(payload["cells"]) == 5
          assert all(cell["selector"]["graphs"] == 20 for cell in payload["cells"])
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: selector-threshold-sensitivity
          path: |
            results/state_of_art/fresh_sota_latest.json
            results/state_of_art/selector_threshold_sensitivity_latest.json
          if-no-files-found: error
