name: K8 external runtime preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/k8_external_runtime_preflight.py"
      - "tests/test_k8_external_runtime_preflight.py"
      - ".github/workflows/k8-external-runtime-preflight.yml"
      - "src/atof/portfolio.py"
      - "src/atof/topology.py"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ATOF and benchmark backends
        run: python -m pip install -e ".[dev,sota,metis,kahip]"

      - name: Protocol tests
        run: pytest -q tests/test_k8_external_runtime_preflight.py

      - name: Run runtime preflight
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts
          python experiments/k8_external_runtime_preflight.py             --output artifacts/k8_external_runtime_preflight_latest.json             --cache-dir .cache/snap_external

      - name: Validate preflight
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("artifacts/k8_external_runtime_preflight_latest.json").read_text()
          )
          assert p["k"] == 8
          assert p["seed"] == 5003
          assert p["graph"]["nodes"] == 4039
          assert p["graph"]["edges"] == 88234
          assert len(p["solver"]["candidates"]) >= 8
          PY

      - name: Upload preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: k8-external-runtime-preflight
          path: artifacts/k8_external_runtime_preflight_latest.json

  solver-matrix:
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'research/k8-external-runtime-preflight') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        dataset: [ca_astroph, ca_condmat]
        seed: [5003, 7003, 9001, 12011, 16001]
        strategy: [bloc, bloc-affinity, metis, kahip, kaminpar, kaminpar-strong, mtkahypar, mtkahypar-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF and benchmark backends
        run: python -m pip install -e ".[dev,sota,metis,kahip]"
      - name: Run one external solver unit
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts/unit .cache/snap_external
          python experiments/k8_external_solver_unit.py \
            --dataset "${{ matrix.dataset }}" \
            --strategy "${{ matrix.strategy }}" \
            --seed "${{ matrix.seed }}" \
            --output "artifacts/unit/${{ matrix.dataset }}__${{ matrix.strategy }}__${{ matrix.seed }}.json" \
            --cache-dir .cache/snap_external
      - name: Upload solver unit
        uses: actions/upload-artifact@v4
        with:
          name: k8-external-unit-${{ matrix.dataset }}-${{ matrix.strategy }}-${{ matrix.seed }}
          path: artifacts/unit/*.json

  solver-matrix-aggregate:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'research/k8-external-runtime-preflight' }}
    needs: solver-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF
        run: python -m pip install -e ".[dev]"
      - name: Download frozen training fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/training
          curl -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o artifacts/training/prior.zip \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10912529806/zip"
          unzip -q artifacts/training/prior.zip -d artifacts/training
          test -f artifacts/training/k8_external_training_fixture.json
      - name: Download solver units
        uses: actions/download-artifact@v4
        with:
          pattern: k8-external-unit-*
          path: artifacts/units
          merge-multiple: true
      - name: Aggregate
        env:
          PYTHONPATH: .
        run: |
          python experiments/k8_external_solver_aggregate.py \
            --input-dir artifacts/units \
            --training-fixture artifacts/training/k8_external_training_fixture.json \
            --output artifacts/k8_external_solver_matrix_latest.json \
            --cache-dir .cache/snap_external
      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: k8-external-solver-matrix
          path: artifacts/k8_external_solver_matrix_latest.json
