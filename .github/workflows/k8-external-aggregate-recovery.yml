name: Recover k8 external aggregate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/k8-external-aggregate-recovery.yml"

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF
        run: python -m pip install -e ".[dev]"
      - name: Download frozen training fixture
        uses: actions/download-artifact@v4
        with:
          name: k8-external-training-fixture
          run-id: 36262997611
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/training
      - name: Download all completed solver units
        uses: actions/download-artifact@v4
        with:
          pattern: k8-external-unit-*
          run-id: 36266490840
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/units
          merge-multiple: true
      - name: Verify matrix
        run: |
          test $(find artifacts/units -name '*.json' | wc -l) -eq 80
      - name: Aggregate
        env:
          PYTHONPATH: .
        run: |
          python experiments/k8_external_solver_aggregate.py \
            --input-dir artifacts/units \
            --training-fixture artifacts/training/k8_external_training_fixture.json \
            --output artifacts/k8_external_solver_matrix_latest.json \
            --cache-dir .cache/snap_external
      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: k8-external-solver-matrix-recovered
          path: artifacts/k8_external_solver_matrix_latest.json