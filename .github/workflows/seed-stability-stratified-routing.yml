name: Seed-stability stratified routing research

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/seed_stability_stratified_routing.py"
      - "tests/test_seed_stability_stratified_routing.py"
      - ".github/workflows/seed-stability-stratified-routing.yml"
      - "experiments/fresh_sota_protocol.py"
      - "src/atof/routing.py"
      - "src/atof/statistics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF and benchmark backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,metis,kahip,sota,dev]"
      - name: Run stability tests
        run: pytest -q tests/test_seed_stability_stratified_routing.py
      - name: Run fresh benchmark
        run: |
          python -m experiments.fresh_sota_protocol             --output results/state_of_art/fresh_sota_latest.json             --cache-dir .cache/snap
      - name: Validate fresh benchmark completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/fresh_sota_latest.json").read_text(encoding="utf-8"))
          assert payload["matched_graphs"] == 20
          assert len(payload["candidate_strategies"]) == 11
          assert payload["seeds"] == [42, 101, 2024]
          assert len(payload["rows"]) == 660
          assert all(row["status"] == "ok" for row in payload["rows"])
          PY
      - name: Run stability calibration
        run: |
          python -m experiments.seed_stability_stratified_routing             --benchmark results/state_of_art/fresh_sota_latest.json             --output results/state_of_art/seed_stability_stratified_routing_latest.json
      - name: Validate stability manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/seed_stability_stratified_routing_latest.json").read_text(encoding="utf-8"))
          assert payload["aggregate"]["graphs"] == 20
          assert len(payload["folds"]) == 4
          assert payload["router"]["scale_mode"] == "iqr"
          assert payload["router"]["metric"] == "l2"
          assert payload["aggregate"]["stable_graphs"] + payload["aggregate"]["unstable_graphs"] == 20
          PY
      - name: Upload stability artifact
        uses: actions/upload-artifact@v4
        with:
          name: seed-stability-stratified-routing
          path: |
            results/state_of_art/fresh_sota_latest.json
            results/state_of_art/seed_stability_stratified_routing_latest.json
          if-no-files-found: error
