name: Recover k8 external aggregate final

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/k8-external-aggregate-recovery-final.yml"
      - "experiments/k8_external_solver_aggregate.py"

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: k8-external-training-fixture
          run-id: 36262997611
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: artifacts/training
      - uses: actions/download-artifact@v4
        with:
          pattern: k8-external-unit-*
          run-id: 36266490840
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true
          path: artifacts/units
      - uses: actions/download-artifact@v4
        with:
          name: k8-external-topology-ca_astroph
          run-id: 36271148222
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: artifacts/topology
      - uses: actions/download-artifact@v4
        with:
          name: k8-external-topology-ca_condmat
          run-id: 36271148222
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: artifacts/topology
      - name: Verify inputs
        run: |
          test "$(find artifacts/topology -name '*.json' | wc -l)" -eq 2
          test "$(find artifacts/units -name '*.json' | wc -l)" -eq 80
      - name: Aggregate
        run: |
          PYTHONPATH=. python experiments/k8_external_solver_aggregate.py \
            --input-dir artifacts/units \
            --training-fixture artifacts/training/k8_external_training_fixture.json \
            --output artifacts/k8_external_solver_matrix_latest.json \
            --topology-dir artifacts/topology
      - uses: actions/upload-artifact@v4
        with:
          name: k8-external-solver-matrix-recovered-final
          path: artifacts/k8_external_solver_matrix_latest.json
          if-no-files-found: error
          retention-days: 7
