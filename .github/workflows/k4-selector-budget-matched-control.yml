name: K4 online selector budget-matched control research

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/k4_online_selector.py"
      - "experiments/k4_five_seed_replication.py"
      - "experiments/k4_routing_generalization.py"
      - "experiments/k4_selector_budget_matched_control.py"
      - "tests/test_k4_online_selector.py"
      - "tests/test_k4_selector_budget_matched_control.py"
      - ".github/workflows/k4-selector-budget-matched-control.yml"
      - "src/atof/routing.py"
      - "src/atof/statistics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget-control:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ATOF and benchmark backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,metis,kahip,sota,dev]"

      - name: Run control tests
        run: |
          pytest -q             tests/test_k4_online_selector.py             tests/test_k4_selector_budget_matched_control.py

      - name: Run validated k=4 five-seed benchmark
        run: |
          python -m experiments.k4_five_seed_replication             --output results/state_of_art/k4_five_seed_latest.json             --cache-dir .cache/snap

      - name: Validate benchmark manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/state_of_art/k4_five_seed_latest.json")
              .read_text(encoding="utf-8")
          )
          assert payload["k"] == 4
          assert payload["seeds"] == [7, 42, 101, 2024, 8191]
          assert len(payload["candidate_strategies"]) == 8
          assert len(payload["graph_manifest"]) == 20
          assert payload["evaluation"]["graphs"] == 20
          PY

      - name: Run budget-matched control
        run: |
          python -m experiments.k4_selector_budget_matched_control             --benchmark results/state_of_art/k4_five_seed_latest.json             --output results/state_of_art/k4_selector_budget_matched_control_latest.json

      - name: Validate control manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/state_of_art/k4_selector_budget_matched_control_latest.json")
              .read_text(encoding="utf-8")
          )
          assert payload["k"] == 4
          assert payload["graphs"] == 20
          assert payload["seed_units"] == 100
          assert payload["random_control"]["repeats"] == 500
          assert 0 <= payload["selector"]["probe_graph_count"] <= 20
          assert 1.0 <= payload["selector"]["mean_actions"] <= 2.0
          assert len(payload["selector_minus_random_control"]["bootstrap_95_ci"]) == 2
          PY

      - name: Upload control artifact
        uses: actions/upload-artifact@v4
        with:
          name: k4-selector-budget-matched-control
          path: |
            results/state_of_art/k4_five_seed_latest.json
            results/state_of_art/k4_selector_budget_matched_control_latest.json
          if-no-files-found: error
