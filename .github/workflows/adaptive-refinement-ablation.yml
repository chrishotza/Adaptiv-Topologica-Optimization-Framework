name: Adaptive refinement ablation

on:
  pull_request:
    paths:
      - "src/atof/refinement.py"
      - "src/atof/strategies.py"
      - "src/atof/product.py"
      - "experiments/generate_suite.py"
      - "experiments/run_adaptive_refinement_ablation.py"
      - "tests/test_refinement.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ablation:
    name: Compare fixed and adaptive refinement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run adaptive ablation
        run: python -m experiments.run_adaptive_refinement_ablation

      - name: Validate ablation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/adaptive-refinement-ablation/latest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["surface"] == "atof.product.optimize_graph"
          assert payload["summary"]["comparisons"] == 42
          assert len(payload["rows"]) == 42
          assert all(
              row["fixed_selected"] == row["adaptive_selected"]
              for row in payload["rows"]
          )
          PY

      - name: Upload ablation artifact
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-refinement-ablation
          path: results/adaptive-refinement-ablation/latest.json
