name: K4 oracle-free online selector

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/k4_online_selector.py"
      - "tests/test_k4_online_selector.py"
      - "experiments/k4_routing_generalization.py"
      - "experiments/k4_five_seed_replication.py"
      - "src/atof/routing.py"
      - "src/atof/statistics.py"
      - "src/atof/portfolio.py"
      - "src/atof/native_backends.py"
      - ".github/workflows/k4-online-selector.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  k4-online-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF and benchmark backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,metis,kahip,sota,dev]"
      - name: Run selector tests
        run: pytest -q tests/test_k4_online_selector.py
      - name: Run validated k=4 five-seed benchmark
        run: |
          python -m experiments.k4_five_seed_replication             --output results/state_of_art/k4_five_seed_latest.json             --cache-dir .cache/snap
      - name: Validate benchmark manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/k4_five_seed_latest.json").read_text(encoding="utf-8"))
          assert payload["k"] == 4
          assert payload["seeds"] == [7, 42, 101, 2024, 8191]
          assert len(payload["candidate_strategies"]) == 8
          assert len(payload["graph_manifest"]) == 20
          for record in payload["graph_manifest"]:
              assert set(map(int, record["by_seed"].keys())) == {7, 42, 101, 2024, 8191}
          PY
      - name: Run oracle-free k=4 selector
        run: |
          python -m experiments.k4_online_selector             --benchmark results/state_of_art/k4_five_seed_latest.json             --output results/state_of_art/k4_online_selector_latest.json
      - name: Validate selector manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/k4_online_selector_latest.json").read_text(encoding="utf-8"))
          assert payload["k"] == 4
          assert payload["seeds"] == [7, 42, 101, 2024, 8191]
          assert payload["aggregate"]["graphs"] == 20
          assert payload["aggregate"]["seed_units"] == 100
          assert 0.0 <= payload["aggregate"]["probe_rate"] <= 1.0
          assert 1.0 <= payload["aggregate"]["mean_actions"] <= 2.0
          PY
      - name: Upload selector artifact
        uses: actions/upload-artifact@v4
        with:
          name: k4-online-selector
          path: |
            results/state_of_art/k4_five_seed_latest.json
            results/state_of_art/k4_online_selector_latest.json
          if-no-files-found: error
