name: Recover k8 external aggregate v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/k8-external-aggregate-recovery-v2.yml"
      - "experiments/k8_external_topology_unit.py"
      - "experiments/k8_external_solver_aggregate.py"

permissions:
  contents: read
  actions: read

jobs:
  topology:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        dataset:
          - ca_astroph
          - ca_condmat
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF
        run: python -m pip install -e ".[dev]"
      - name: Compute frozen topology
        env:
          DATASET: ${{ matrix.dataset }}
        run: |
          mkdir -p artifacts/topology
          PYTHONPATH=. python experiments/k8_external_topology_unit.py \
            --dataset "$DATASET" \
            --output "artifacts/topology/${DATASET}.json" \
            --cache-dir ".cache/snap_external"
      - uses: actions/upload-artifact@v4
        with:
          name: k8-external-topology-${{ matrix.dataset }}
          path: artifacts/topology/*.json
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: topology
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: k8-external-training-fixture
          run-id: 36262997611
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: artifacts/training
      - uses: actions/download-artifact@v4
        with:
          pattern: k8-external-topology-*
          merge-multiple: true
          path: artifacts/topology
      - uses: actions/download-artifact@v4
        with:
          pattern: k8-external-unit-*
          run-id: 36266490840
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true
          path: artifacts/units
      - name: Verify inputs
        run: |
          test "$(find artifacts/topology -name '*.json' | wc -l)" -eq 2
          test "$(find artifacts/units -name '*.json' | wc -l)" -eq 80
      - name: Aggregate
        run: |
          PYTHONPATH=. python experiments/k8_external_solver_aggregate.py \
            --input-dir artifacts/units \
            --training-fixture artifacts/training/k8_external_training_fixture.json \
            --output artifacts/k8_external_solver_matrix_latest.json \
            --topology-dir artifacts/topology
      - uses: actions/upload-artifact@v4
        with:
          name: k8-external-solver-matrix-recovered-v2
          path: artifacts/k8_external_solver_matrix_latest.json
          if-no-files-found: error
          retention-days: 7
