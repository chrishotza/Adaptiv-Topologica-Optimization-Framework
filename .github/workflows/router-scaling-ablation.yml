name: Router scaling ablation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/atof/routing.py"
      - "experiments/run_router_scaling_ablation.py"
      - "tests/test_router_scaling_ablation.py"
      - ".github/workflows/router-scaling-ablation.yml"
      - "docs/generalization-study.md"

jobs:
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run scaling ablation
        run: python -m experiments.run_router_scaling_ablation
      - name: Validate result
        run: |
          test -s results/generalization/router_scaling_ablation.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/generalization/router_scaling_ablation.json").read_text())
          expected = {
              "all_minmax_l2",
              "all_std_l2",
              "all_iqr_l2",
              "global_paths_minmax_l2",
              "global_paths_std_l2",
              "global_paths_iqr_l2",
              "global_paths_minmax_l1",
              "global_paths_std_l1",
          }
          assert set(payload["configs"]) == expected
          print("validated configs:", sorted(expected))
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atof-router-scaling-ablation
          path: results/generalization/router_scaling_ablation.json
