name: SOTA backend smoke test

on:
  pull_request:
    paths:
      - "src/atof/**"
      - "tests/test_native_backends.py"
      - "tests/test_sota_backends.py"
      - "pyproject.toml"
      - ".github/workflows/sota-backend-integration.yml"
  workflow_dispatch:

jobs:
  sota-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ATOF with SOTA bindings
        run: python -m pip install -e ".[dev,sota]"

      - name: Verify backend availability
        run: python -m atof doctor --full

      - name: Run real SOTA backend smoke tests
        run: pytest -q tests/test_sota_backends.py
