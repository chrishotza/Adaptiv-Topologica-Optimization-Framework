name: SNAP validation

on:
  workflow_dispatch:

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run live SNAP validation
        run: python -m experiments.run_snap_validation

      - name: Validate output
        run: test -s results/snap/latest.json

      - name: Upload result manifest
        uses: actions/upload-artifact@v4
        with:
          name: atof-snap-validation
          path: results/snap/latest.json
