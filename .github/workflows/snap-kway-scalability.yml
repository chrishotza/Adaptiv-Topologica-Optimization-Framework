name: SNAP k-way portfolio scalability

on:
  workflow_dispatch:

jobs:
  kway-scalability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev,sota]"

      - name: Run k-way stress
        run: python -m experiments.run_snap_kway_scalability

      - name: Validate manifest
        run: python - <<'PY'
        import json
        from pathlib import Path

        payload = json.loads(Path("results/snap/kway-scalability-latest.json").read_text())
        assert payload["parameters"]["ks"] == [2, 4, 8]
        assert payload["parameters"]["profile_mode"] == "bounded"
        assert len(payload["rows"]) == 9
        PY

      - name: Upload result manifest
        uses: actions/upload-artifact@v4
        with:
          name: atof-snap-kway-scalability
          path: results/snap/kway-scalability-latest.json
