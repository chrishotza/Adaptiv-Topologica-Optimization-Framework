name: K4 online selector threshold sensitivity research

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/k4_online_selector.py"
      - "experiments/k4_five_seed_replication.py"
      - "experiments/k4_routing_generalization.py"
      - "experiments/k4_selector_threshold_sensitivity.py"
      - "tests/test_k4_online_selector.py"
      - "tests/test_k4_selector_threshold_sensitivity.py"
      - ".github/workflows/k4-selector-threshold-sensitivity.yml"
      - "src/atof/routing.py"
      - "src/atof/statistics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ATOF and benchmark backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,metis,kahip,sota,dev]"

      - name: Run selector tests
        run: |
          pytest -q             tests/test_k4_online_selector.py             tests/test_k4_selector_threshold_sensitivity.py

      - name: Run validated k=4 five-seed benchmark
        run: |
          python -m experiments.k4_five_seed_replication             --output results/state_of_art/k4_five_seed_latest.json             --cache-dir .cache/snap

      - name: Validate benchmark manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/state_of_art/k4_five_seed_latest.json")
              .read_text(encoding="utf-8")
          )
          assert payload["k"] == 4
          assert payload["seeds"] == [7, 42, 101, 2024, 8191]
          assert len(payload["candidate_strategies"]) == 8
          assert len(payload["graph_manifest"]) == 20
          assert payload["evaluation"]["graphs"] == 20
          for record in payload["graph_manifest"]:
              assert len(record["by_seed"]) == 5
          PY

      - name: Run threshold sensitivity
        run: |
          python -m experiments.k4_selector_threshold_sensitivity             --benchmark results/state_of_art/k4_five_seed_latest.json             --output results/state_of_art/k4_selector_threshold_sensitivity_latest.json

      - name: Validate sensitivity manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("results/state_of_art/k4_selector_threshold_sensitivity_latest.json")
              .read_text(encoding="utf-8")
          )
          assert payload["k"] == 4
          assert payload["seeds"] == [7, 42, 101, 2024, 8191]
          assert payload["thresholds"] == [0.0, 0.0025, 0.005, 0.01, 0.02]
          assert len(payload["cells"]) == 5

          baseline = payload["cells"][0]
          assert baseline["threshold"] == 0.0
          assert abs(baseline["probe_rate"] - 0.30) < 1e-12
          assert abs(baseline["mean_actions"] - 1.30) < 1e-12
          assert abs(
              baseline["paired_selector_minus_top1"]["mean"]
              - (-0.005649469010581708)
          ) < 1e-12

          for cell in payload["cells"]:
              assert cell["selector"]["graphs"] == 20
              assert cell["top1"]["graphs"] == 20
              assert 0.0 <= cell["probe_rate"] <= 1.0
              assert 1.0 <= cell["mean_actions"] <= 2.0
          PY

      - name: Upload sensitivity artifact
        uses: actions/upload-artifact@v4
        with:
          name: k4-selector-threshold-sensitivity
          path: |
            results/state_of_art/k4_five_seed_latest.json
            results/state_of_art/k4_selector_threshold_sensitivity_latest.json
          if-no-files-found: error
