name: Large graph topology validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/atof/topology.py"
      - "experiments/validate_large_graph_topology.py"
      - "research/large-graph-topology-freeze.json"
      - ".github/workflows/large-graph-topology-validation.yml"
      - "src/atof/dimacs.py"
      - "src/atof/snap.py"
  push:
    branches:
      - "main"
      - "research/independent-dimacs-transfer"
    paths:
      - "src/atof/topology.py"
      - "experiments/validate_large_graph_topology.py"
      - "research/large-graph-topology-freeze.json"
      - ".github/workflows/large-graph-topology-validation.yml"
      - "src/atof/dimacs.py"
      - "src/atof/snap.py"

jobs:
  validate-large-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,kahip,metis,analysis]"
      - name: Unit tests
        run: |
          pytest tests/test_topology.py tests/test_topology_scalability.py
      - name: Validate frozen large-graph topology
        run: |
          python -m experiments.validate_large_graph_topology             --fixture research/large-graph-topology-freeze.json             --output results-large-topology.json
      - name: Upload topology validation
        uses: actions/upload-artifact@v4
        with:
          name: atof-large-graph-topology-validation
          path: results-large-topology.json
          if-no-files-found: error
