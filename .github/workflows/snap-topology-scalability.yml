name: SNAP topology scalability

on:
  workflow_dispatch:
  push:
    branches:
      - hardening/topology-profile-scalability-clean

jobs:
  snap-scalability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run bounded profiling stress test
        run: python -m experiments.run_snap_scalability

      - name: Validate result
        run: python - <<'PY'
        import json
        from pathlib import Path

        path = Path("results/snap/scalability-latest.json")
        payload = json.loads(path.read_text(encoding="utf-8"))
        assert payload["profiler_limits"]["mode"] == "bounded"
        assert len(payload["rows"]) == 3
        assert all(row["profile_mode"] == "bounded" for row in payload["rows"])
        PY

      - name: Upload result manifest
        uses: actions/upload-artifact@v4
        with:
          name: atof-snap-topology-scalability
          path: results/snap/scalability-latest.json
