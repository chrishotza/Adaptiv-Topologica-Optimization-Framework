name: Online selector threshold transition research

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/selector_threshold_transition.py"
      - "tests/test_selector_threshold_transition.py"
      - ".github/workflows/selector-threshold-transition.yml"
      - "experiments/online_topk_selector.py"
      - "experiments/selector_threshold_sensitivity.py"
      - "experiments/fresh_sota_protocol.py"
      - "src/atof/routing.py"
      - "src/atof/statistics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ATOF and benchmark backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,metis,kahip,sota,dev]"
      - name: Run transition tests
        run: pytest -q tests/test_selector_threshold_transition.py
      - name: Run fresh benchmark
        run: |
          python -m experiments.fresh_sota_protocol             --output results/state_of_art/fresh_sota_latest.json             --cache-dir .cache/snap
      - name: Validate benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/fresh_sota_latest.json").read_text(encoding="utf-8"))
          assert payload["matched_graphs"] == 20
          assert len(payload["candidate_strategies"]) == 11
          assert payload["seeds"] == [42, 101, 2024]
          assert len(payload["rows"]) == 660
          assert all(row["status"] == "ok" for row in payload["rows"])
          PY
      - name: Run threshold transition analysis
        run: |
          python -m experiments.selector_threshold_transition             --benchmark results/state_of_art/fresh_sota_latest.json             --output results/state_of_art/selector_threshold_transition_latest.json
      - name: Validate transition manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("results/state_of_art/selector_threshold_transition_latest.json").read_text(encoding="utf-8"))
          assert payload["thresholds"] == [
              0.005, 0.006, 0.007, 0.008, 0.009,
              0.01, 0.011, 0.0125, 0.015, 0.02
          ]
          assert len(payload["activation"]) == 10
          assert len(payload["performance_cells"]) == 10
          assert payload["prediction_distribution"]["graphs"] == 20
          assert all(
              cell["graph_count"] == 20
              for cell in payload["activation"]
          )
          assert all(
              cell["selector"]["graphs"] == 20
              for cell in payload["performance_cells"]
          )
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: selector-threshold-transition
          path: |
            results/state_of_art/fresh_sota_latest.json
            results/state_of_art/selector_threshold_transition_latest.json
          if-no-files-found: error
